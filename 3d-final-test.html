<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>MY CAREER | 3D Proof</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101b;color:#fff;font-family:system-ui}#viewport{position:fixed;inset:0}#viewport canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:linear-gradient(#03101bda,transparent);pointer-events:none}#score{font-weight:900;letter-spacing:1px;font-size:clamp(14px,2.5vw,23px)}#clock{background:#ffffff22;border-radius:7px;padding:5px 10px}#status{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:46%;font-size:11px;background:#081b2ac9;padding:8px;border-radius:7px}#controls{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}button{border:1px solid #ffffff77;background:#10283acb;color:white;border-radius:50%;width:clamp(56px,11vw,84px);height:clamp(56px,11vw,84px);font-size:12px;font-weight:800;touch-action:manipulation}button:active{background:#d8a941}#reset{position:fixed;right:10px;top:58px;border-radius:10px;width:auto;height:auto;padding:9px;background:#111e30b8}#hint{position:fixed;left:0;right:0;top:45%;text-align:center;font-weight:900;font-size:clamp(22px,5vw,46px);text-shadow:0 3px 15px black;pointer-events:none}#rotate{position:fixed;top:60px;left:12px;font-size:11px;color:#e8e9ed}@media(orientation:landscape){#rotate{display:none}}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="viewport"></div><div id="top"><span id="score">MY CAREER · 3D TEST</span><span id="clock">68:24</span></div><div id="rotate">↻ Pro nejlepší zobrazení otoč iPhone na šířku</div><div id="hint"></div><div id="status">Načítám 3D engine…</div><button id="reset">Nová střela ↻</button><div id="controls"><button id="left">SKOK<br>VLEVO</button><button id="middle">STŘED</button><button id="right">SKOK<br>VPRAVO</button></div>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {clone} from 'three/addons/utils/SkeletonUtils.js';
const status=document.querySelector('#status'),hint=document.querySelector('#hint'),view=document.querySelector('#viewport');
const scene=new T.Scene();scene.background=new T.Color('#111c30');scene.fog=new T.Fog('#111c30',90,180);
const renderer=new T.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;view.append(renderer.domElement);
const camera=new T.PerspectiveCamera(65,1,.1,250);camera.position.set(0,3.8,-11.5);camera.lookAt(0,1.3,16);
scene.add(new T.HemisphereLight(0xc0d6ff,0x1a4222,2));
const light=new T.DirectionalLight(0xffe9cb,3);light.position.set(-14,35,12);light.castShadow=true;light.shadow.mapSize.set(1024,1024);light.shadow.camera.left=-50;light.shadow.camera.right=50;light.shadow.camera.top=60;light.shadow.camera.bottom=-50;scene.add(light);
const material=(c,roughness=.8)=>new T.MeshStandardMaterial({color:c,roughness});
const turf=material(0x256f3c),lineMat=new T.MeshBasicMaterial({color:0xf0f4ef}),concrete=material(0x2b3445),seats=[material(0x1b4672),material(0x27588c),material(0x527ca2),material(0x899baa)];
function add(geo,mat,x,y,z,parent=scene){const o=new T.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const pitch=add(new T.PlaneGeometry(90,125),turf,0,0,30);pitch.rotation.x=-Math.PI/2;pitch.castShadow=false;
for(let i=0;i<15;i++){const strip=add(new T.PlaneGeometry(90,5),material(i%2?0x277744:0x2b8050),0,.003,-7+i*6);strip.rotation.x=-Math.PI/2;strip.castShadow=false}
function mark(x1,z1,x2,z2){let dx=x2-x1,dz=z2-z1;let m=add(new T.BoxGeometry(.095,.012,Math.hypot(dx,dz)),lineMat,(x1+x2)/2,.02,(z1+z2)/2);m.rotation.y=Math.atan2(dx,dz);m.castShadow=false}
mark(-34,0,34,0);mark(-34,0,-34,85);mark(34,0,34,85);mark(-34,85,34,85);mark(-20,0,-20,16);mark(20,0,20,16);mark(-20,16,20,16);mark(-9,0,-9,6);mark(9,0,9,6);mark(-9,6,9,6);
function bar(a,b,r=.065){let v=new T.Vector3(...b).sub(new T.Vector3(...a));let m=add(new T.CylinderGeometry(r,r,v.length(),12),material(0xffffff,.3),...(new T.Vector3(...a).add(new T.Vector3(...b)).multiplyScalar(.5).toArray()));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),v.normalize())}
bar([-3.66,0,0],[-3.66,2.44,0]);bar([3.66,0,0],[3.66,2.44,0]);bar([-3.66,2.44,0],[3.66,2.44,0]);bar([-3.66,2.44,0],[-3.66,2.44,-2]);bar([3.66,2.44,0],[3.66,2.44,-2]);
const netmat=new T.LineBasicMaterial({color:0xcbdbe6,transparent:true,opacity:.5});
function net(a,b){scene.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(...a),new T.Vector3(...b)]),netmat))}
for(let x=-3.66;x<=3.67;x+=.28){net([x,0,0],[x,2.44,0]);net([x,2.44,0],[x,2.44,-2]);net([x,0,-2],[x,2.44,-2])}
for(let y=0;y<=2.45;y+=.26){net([-3.66,y,0],[3.66,y,0]);net([-3.66,y,-2],[3.66,y,-2]);net([-3.66,y,0],[-3.66,y,-2]);net([3.66,y,0],[3.66,y,-2])}
for(let side of [-1,1])for(let tier=0;tier<15;tier++){const x=side*(38+tier*1.4),y=.3+tier*.62;add(new T.BoxGeometry(1.3,.65,125),concrete,x,y,28);for(let j=0;j<57;j++)add(new T.BoxGeometry(.65,.28,.55),seats[(j+tier)%4],x,y+.37,-23+j*1.8)}
for(let tier=0;tier<12;tier++){let z=89+tier*1.4,y=.4+tier*.65;add(new T.BoxGeometry(110,.7,1.3),concrete,0,y,z);for(let j=0;j<55;j++)add(new T.BoxGeometry(.65,.3,.5),seats[(j+tier)%4],-50+j*1.85,y+.35,z)}
for(let x of [-38,38])for(let z of [-10,75]){bar([x,0,z],[x,23,z],.23);const lamp=add(new T.BoxGeometry(8,1.4,.7),new T.MeshBasicMaterial({color:0xfff5db}),x,23,z);lamp.castShadow=false}
const keeperRoot=new T.Group(),strikerRoot=new T.Group();keeperRoot.position.set(0,0,-.7);strikerRoot.position.set(0,0,25);scene.add(keeperRoot,strikerRoot);
const ball=add(new T.SphereGeometry(.22,24,16),material(0xf5f5f5,.45),0,.22,24);
for(let i=0;i<8;i++){const a=i*Math.PI*.75;add(new T.IcosahedronGeometry(.045,0),material(0x10151d),Math.sin(a)*.218,Math.cos(a)*.218,Math.sin(a*1.3)*.06,ball)}
const mixers=[];
let modelLoaded=false;
try{
 status.textContent='Načítám animované 3D postavy…';
 const gltf=await new Promise((resolve,reject)=>new GLTFLoader().load('https://threejs.org/examples/models/gltf/Soldier.glb',resolve,undefined,reject));
 const action=gltf.animations.find(c=>/idle/i.test(c.name))||gltf.animations[0];
 for(const [idx,root] of [keeperRoot,strikerRoot].entries()){
 const model=clone(gltf.scene);model.scale.setScalar(1.25);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});root.add(model);
 if(action){const mixer=new T.AnimationMixer(model);mixer.clipAction(action).play();mixers.push(mixer)}
 if(idx===1)root.rotation.y=Math.PI;
 }
 modelLoaded=true;status.textContent='Skutečné 3D modely načteny ✓ · testovací vojáci, nikoli fotbalisté';
}catch(e){status.textContent='Modely se nenačetly: '+e.message+' · bez náhradních figurek';}
let shotStart=performance.now(),dive=0,diveSide=0,keeperX=0,done=false,shots=0,saves=0,displayUntil=0;
function newShot(){shotStart=performance.now();dive=0;diveSide=0;done=false;hint.textContent='';ball.position.set(0,.22,24)}
function save(side){if(done)return;dive=performance.now();diveSide=side;keeperX=side*1.35}
document.querySelector('#left').onclick=()=>save(-1);document.querySelector('#right').onclick=()=>save(1);document.querySelector('#middle').onclick=()=>save(0);document.querySelector('#reset').onclick=newShot;
function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w>h?65:53;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
const clock=new T.Clock();let targetX=0,targetY=1;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);for(let m of mixers)m.update(dt);const now=performance.now(),elapsed=(now-shotStart)/1000;
if(!done&&elapsed>1.5){let p=Math.min(1,(elapsed-1.5)/1.2);ball.position.set(targetX*p,.22+(targetY-.22)*p+Math.sin(p*Math.PI)*.3,24*(1-p));ball.rotation.x+=dt*5;
if(p>=1){done=true;shots++;const stopped=dive>0&&Math.abs(keeperX-targetX)<1.6&&(dive-shotStart)/1000<2.65;if(stopped)saves++;hint.textContent=stopped?'SKVĚLÝ ZÁKROK!':'GÓL!';displayUntil=now+1400}}
if(done&&now>displayUntil){targetX=(Math.random()-.5)*5.5;targetY=.5+Math.random()*1.7;newShot()}
if(dive){const p=Math.min(1,(now-dive)/500);keeperRoot.position.x+=(keeperX-keeperRoot.position.x)*.13;keeperRoot.position.y=Math.sin(p*Math.PI)*.55;keeperRoot.rotation.z=-diveSide*p*.8}else{keeperRoot.position.y=0;keeperRoot.rotation.z=0}
camera.position.x+=(keeperRoot.position.x*.14-camera.position.x)*.03;camera.lookAt(0,1.4,15);renderer.render(scene,camera)}
targetX=(Math.random()-.5)*5.5;targetY=.5+Math.random()*1.7;frame();
</script></body></html>
