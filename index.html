'use strict';const KEY='mycareer_full_v1';const clubs=[{name:'FC Jindřichův Hradec',tier:1,pay:6500,ovr:45},{name:'FC Tábor',tier:2,pay:14000,ovr:55},{name:'SK České Budějovice',tier:3,pay:27000,ovr:64},{name:'AC Praha',tier:4,pay:52000,ovr:73},{name:'FC Rotterdam',tier:5,pay:90000,ovr:80},{name:'London United',tier:6,pay:160000,ovr:88},{name:'Madrid Royal',tier:7,pay:260000,ovr:94}];const items=[{id:'boots',name:'Profesionální kopačky',cost:12000,desc:'+2 reflexy při zákrocích',effect:'reflex'},{id:'coach',name:'Osobní trenér',cost:45000,desc:'+25 % zkušeností z tréninku',effect:'xp'},{id:'car1',name:'První auto',cost:180000,desc:'+5 popularity',effect:'fans'},{id:'flat',name:'Vlastní byt',cost:550000,desc:'+8 regenerace za odpočinek',effect:'rest'},{id:'car2',name:'Sportovní vůz',cost:1300000,desc:'+20 popularity',effect:'fans'},{id:'villa',name:'Luxusní vila',cost:6000000,desc:'+15 regenerace za odpočinek',effect:'rest'}];const newState=()=>({name:'Jakub Strelec',age:17,season:1,week:1,day:1,club:0,money:35000,pay:clubs[0].pay,contract:2,ovr:52,reflex:48,position:50,handling:50,energy:100,trust:65,fans:100,xp:0,played:0,saves:0,goals:0,wins:0,points:0,teamFor:0,teamAgainst:0,owned:[],history:[],events:['Vítej v prvním týmu! Trenér ti dává šanci ukázat talent.'],offer:null,trainingToday:false,matchToday:false,phase:'home',game:null,trainingStreak:0});let S;try{S=Object.assign(newState(),JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch{S=newState()}S.phase='home';S.game=null;let tab='home',G=null,raf=0,canvas,ctx,scene={};const $=id=>document.getElementById(id),money=n=>Math.round(n).toLocaleString('cs-CZ')+' Kč',clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function save(){let copy={...S,game:null,phase:'home'};try{localStorage.setItem(KEY,JSON.stringify(copy))}catch{}}function notify(s){let e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(notify.t);notify.t=setTimeout(()=>e.style.display='none',2600)}function log(s){S.events.unshift('T'+S.season+' / '+S.week+'. týden: '+s);S.events=S.events.slice(0,24)}function btn(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function stat(label,val){return `<div class="stat"><strong>${val}</strong><small>${label}</small></div>`}function bar(label,v){return `<div class="row mini"><span>${label}</span><b>${Math.round(v)}/100</b></div><div class="progress"><i style="width:${clamp(v,0,100)}%"></i></div>`}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(){let tabs=[['home','🏠','Kariéra'],['train','🎯','Trénink'],['match','🥅','Zápas'],['life','🚗','Život'],['agent','📨','Agent']];$('nav').innerHTML=tabs.map(([id,ic,t])=>`<button class="${tab===id?'active':''}" onclick="switchTab('${id}')"><span>${ic}</span>${t}</button>`).join('');$('headMoney').textContent=money(S.money);$('headDate').textContent=`${S.season}. sezóna · Týden ${S.week}`}
function render(){nav();if(G){showGame();return}let html='';if(tab==='home'){html=`<h1>Moje kariéra</h1><div class="card accent"><div class="row"><div><span class="tag">BRANKÁŘ · ${S.age} LET</span><h2 style="margin-top:12px">${safe(S.name)}</h2><div class="muted">${clubs[S.club].name}</div></div><div style="text-align:center"><div style="font-size:40px;color:var(--gold);font-weight:900">${S.ovr}</div><small>CELKOVÉ HODNOCENÍ</small></div></div><div class="grid" style="margin-top:14px">${stat('Výplata za týden',money(S.pay))}${stat('Smlouva',S.contract+' sezóny')}${stat('Důvěra trenéra',S.trust+' %')}${stat('Fanoušci',S.fans.toLocaleString('cs-CZ'))}</div></div><div class="card"><h2>📅 Týden ${S.week} / 12</h2><p>${S.matchToday?'Zápas tento týden už proběhl.':S.day>=4?'Je den zápasu. Čeká tě soupeř!':'Připrav se na víkendový zápas. Trénuj, odpočívej nebo pokračuj na další den.'}</p><div class="row"><span class="pill">Den ${S.day}/7</span><span class="pill">Energie ${S.energy}%</span></div>${bar('Zkušenosti do další úrovně',S.xp%100)}<div class="grid">${btn('Pokračovat o den →','nextDay()','primary wide')}${btn('Trénovat','switchTab(\'train\')','wide')}</div></div><div class="card"><h2>Schopnosti</h2>${bar('Reflexy',S.reflex)}${bar('Postavení',S.position)}${bar('Chytání',S.handling)}${bar('Kondice',S.energy)}</div><div class="card"><h2>Statistiky kariéry</h2><div class="grid cols3">${stat('Zápasy',S.played)}${stat('Zákroky',S.saves)}${stat('Obdržené góly',S.goals)}${stat('Výhry',S.wins)}${stat('Body v lize',S.points)}${stat('Gólový rozdíl',S.teamFor+' : '+S.teamAgainst)}</div></div><div class="card"><h2>Události</h2>${S.events.slice(0,6).map(x=>`<div class="listitem mini">${safe(x)}</div>`).join('')}</div><div class="card"><h3>Nastavení hráče</h3><div class="grid">${btn('Změnit jméno','rename()')}${btn('Nová kariéra','resetGame()')}</div></div>`}
if(tab==='train'){html=`<h1>Tréninkové centrum</h1><p class="muted">Hraj skutečné brankářské situace ve 3D. Získávej zkušenosti a zlepšuj schopnosti.</p><div class="card">${bar('Energie',S.energy)}${S.trainingToday?'<p class="red">Dnes už jsi trénoval. Pokračuj na další den.</p>':'<p>Každý trénink stojí 14 energie. Výkon ovlivňuje získané zkušenosti.</p>'}<div class="listitem"><h2>⚡ Reflexy</h2><p>5 rychlých střel z různých úhlů. Reaguj na směr míče.</p>${btn('Spustit reflexy','startGame(\'reflex\')','primary wide')}</div><div class="listitem"><h2>🥅 Penalty</h2><p>5 pokutových kopů. Vyber směr zákroku ve správnou chvíli.</p>${btn('Chytat penalty','startGame(\'penalty\')','wide')}</div><div class="listitem"><h2>🧤 Postavení</h2><p>5 nájezdů. Přesuň se do dráhy střely a zasáhni.</p>${btn('Trénovat postavení','startGame(\'position\')','wide')}</div></div><div class="card"><h2>Regenerace</h2><p>Volný den obnoví energii. Trénink i zápas ji spotřebovávají.</p>${btn('Odpočívat dnes','rest()','green wide')}</div>`}
if(tab==='match'){let due=S.day>=4&&!S.matchToday;html=`<h1>Zápasový den</h1><div class="card accent"><div class="row"><div><small>DOMÁCÍ</small><h2>${clubs[S.club].name}</h2></div><div style="font-size:30px">⚽</div><div style="text-align:right"><small>HOSTÉ</small><h2>${['FK Písek','SK Třeboň','FC Vltava','TJ Slavia','SK Tábor','FC Vysočina'][S.week%6]}</h2></div></div><p class="muted">${due?'Trenér tě zařadil do základní sestavy. Čekají tě důležité momenty.':S.matchToday?'Tento týden už máš odehráno.':'Zápas se zpřístupní ve čtvrtek. Posouvej dny v kariéře.'}</p>${bar('Připravenost',S.energy)}${btn('Nastoupit do zápasu','startGame(\'match\')','primary wide')}${btn('Pokračovat o den','nextDay()','wide')}</div><div class="card"><h2>Jak se hraje</h2><p>3D pohled od brankáře. Sleduj střelce, před střelou se přesuň tahem po hřišti a při letu míče klepni na směr zákroku nebo táhni prstem. Každý zápas má 5 klíčových momentů. Zbytek simuluje tým.</p><p>Výkony ovlivňují výsledek, hodnocení, důvěru trenéra a nabídky dalších klubů.</p></div>`}
if(tab==='life'){html=`<h1>Osobní život</h1><div class="card"><h2>💳 Finance</h2><div class="grid">${stat('Na účtu',money(S.money))}${stat('Týdenní příjem',money(S.pay))}</div><p class="muted mini">Výplata přichází každých 7 herních dní. Nákupy jsou trvalé a přinášejí malé bonusy.</p></div><h2>Obchod a majetek</h2>${items.map(it=>`<div class="card"><div class="row"><div><h3>${it.name}</h3><small>${it.desc}</small></div><strong class="gold">${money(it.cost)}</strong></div>${btn(S.owned.includes(it.id)?'Zakoupeno':'Koupit',`buy('${it.id}')`,'wide')}${S.owned.includes(it.id)?'<small class="greenText">✓ Vlastníš</small>':''}</div>`).join('')}<div class="card"><h2>Volný čas</h2><p>Den odpočinku doplní energii. Vlastní bydlení zlepšuje regeneraci.</p>${btn('Odpočívat','rest()','green wide')}</div>`}
if(tab==='agent'){html=`<h1>Agent & smlouvy</h1><div class="card"><h2>Současná smlouva</h2><div class="grid">${stat('Klub',clubs[S.club].name)}${stat('Týdenní plat',money(S.pay))}${stat('Zbývá',S.contract+' sezóny')}${stat('Hodnocení',S.ovr)}</div><p class="muted">Po každé sezóně agent vyhodnocuje nabídky podle tvých výkonů. Můžeš zůstat, nebo přestoupit.</p></div>${S.offer?`<div class="card accent"><span class="tag">NOVÁ NABÍDKA</span><h2 style="margin-top:10px">${clubs[S.offer.club].name}</h2><div class="grid">${stat('Plat',money(S.offer.pay)+'/týden')}${stat('Délka smlouvy',S.offer.years+' roky')}</div><p>${S.offer.club>S.club?'Větší klub nabízí novou výzvu. Konkurence bude silnější.':'Nová příležitost získat herní praxi.'}</p><div class="grid">${btn('Přijmout','acceptOffer()','primary wide')}${btn('Odmítnout','rejectOffer()','wide')}</div>${btn('Vyjednat +15 %','negotiate()','wide')}</div>`:'<div class="card"><h2>📭 Žádná aktivní nabídka</h2><p>Odehraj sezónu a zlepšuj se. Na konci sezóny tě agent kontaktuje.</p></div>'}<div class="card"><h2>Klubový žebříček</h2>${clubs.map((c,i)=>`<div class="listitem row"><span>${i===S.club?'🟢':'⚽'} ${c.name}</span><span class="muted mini">Úroveň ${c.tier}</span></div>`).join('')}</div>`}
$('app').innerHTML=html}
function switchTab(t){if(G){notify('Nejdřív dokonči rozehranou situaci.');return}tab=t;render();scrollTo(0,0)}function nextDay(){if(G)return;S.day++;S.trainingToday=false;S.energy=clamp(S.energy+5,0,100);if(S.day>7){S.day=1;S.week++;S.matchToday=false;S.money+=S.pay;log('Přišla výplata '+money(S.pay)+'.');notify('Výplata +'+money(S.pay));if(S.week>12){endSeason();S.week=1}}save();render()}function rest(){if(S.trainingToday){notify('Dnes už jsi trénoval.');return}S.energy=clamp(S.energy+24+(S.owned.includes('flat')?8:0)+(S.owned.includes('villa')?15:0),0,100);S.trainingToday=true;log('Volný den a regenerace.');notify('Energie obnovena.');save();render()}function buy(id){let it=items.find(x=>x.id===id);if(S.owned.includes(id))return notify('Tohle už vlastníš.');if(S.money<it.cost)return notify('Nemáš dost peněz.');S.money-=it.cost;S.owned.push(id);if(it.effect==='fans')S.fans+=it.id==='car2'?20:5;log('Koupeno: '+it.name);save();render();notify('Nový nákup: '+it.name)}function rename(){let n=prompt('Jméno hráče:',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,35);save();render()}}function resetGame(){if(confirm('Opravdu smazat celou kariéru a začít od začátku?')){S=newState();G=null;tab='home';save();render()}}function endSeason(){S.season++;S.age++;S.contract--;let bonus=clamp(S.points*900,0,30000);S.money+=bonus;log('Sezóna skončila! Klub vyplatil bonus '+money(bonus)+'.');if(S.contract<=0){S.contract=1;S.pay=Math.round(S.pay*1.12);log('Klub prodloužil smlouvu o rok.')}let next=clamp(S.club+(S.ovr>=clubs[Math.min(S.club+1,clubs.length-1)].ovr-8?1:0),0,clubs.length-1);if(next===S.club&&S.club<clubs.length-1&&Math.random()<.35)next++;if(next!==S.club){S.offer={club:next,pay:Math.round(clubs[next].pay*(.8+S.ovr/200)),years:rnd(2,4)};log('Agent přinesl nabídku z klubu '+clubs[next].name+'.')}S.points=0;S.teamFor=0;S.teamAgainst=0;S.wins=0;notify('Začíná '+S.season+'. sezóna!')};function acceptOffer(){if(!S.offer)return;S.club=S.offer.club;S.pay=S.offer.pay;S.contract=S.offer.years;log('Podepsal jsi smlouvu s '+clubs[S.club].name+'.');S.offer=null;S.trust=55;save();render();notify('Přestup dokončen!')}function rejectOffer(){S.offer=null;log('Odmítl jsi přestup.');save();render()}function negotiate(){if(!S.offer)return;let chance=.55+S.trust/500;if(Math.random()<chance){S.offer.pay=Math.round(S.offer.pay*1.15);notify('Klub přijal vyšší plat!')}else{S.offer=null;notify('Jednání ztroskotalo, nabídka padla.')}save();render()}
// Software-rendered 3D world. Every object has 3D coordinates, projected through a perspective camera.
function startGame(type){if(G)return;if(type==='match'&&(S.day<4||S.matchToday))return notify('Zápas není dostupný.');if(type!=='match'&&S.trainingToday)return notify('Dnes už jsi trénoval.');if(S.energy<14)return notify('Jsi příliš unavený. Odpočiň si.');G={type,shot:0,total:5,saved:0,conceded:0,phase:'ready',start:performance.now(),keeperX:0,keeperY:0,dive:0,aimX:0,aimY:0,ballX:0,ballY:0,ballZ:0,ballT:0,shotX:0,shotY:0,shotDuration:0,shotAt:0,result:'',ratings:[],lastFrame:0};showGame();requestAnimationFrame(loop)}function showGame(){if(!G)return;if(stadium3D){stadium3D.dispose();stadium3D=null;}$('app').innerHTML=`<div class="row"><h2>${G.type==='match'?'⚽ Ligový zápas':G.type==='penalty'?'🥅 Penaltový trénink':G.type==='reflex'?'⚡ Reflexní trénink':'🧤 Trénink postavení'}</h2><span class="pill">${G.shot+1} / ${G.total}</span></div><div id="gameWrap"><canvas id="pitch"></canvas><div id="hud"><span id="hudScore">Zákroky ${G.saved} · Góly ${G.conceded}</span><span id="hudPhase">PŘIPRAV SE</span></div><div id="gameHelp">Tahem po hřišti posouvej brankáře. Při střele klepni nebo táhni směrem k míči.</div></div><div id="gameControls"><button class="btn" id="leftBtn">↖ VLEVO</button><button class="btn primary" id="centerBtn">🧤 STŘED</button><button class="btn" id="rightBtn">VPRAVO ↗</button></div><div class="notice mini" id="gameInfo">Zaujmi postavení. Střelec se připravuje...</div><div class="row">${btn('Ukončit aktivitu','quitGame()')}<span class="muted mini">3D WebGL 2.1 · dotykové ovládání</span></div>`;canvas=$('pitch');ctx=canvas.getContext('2d');canvas.width=720;canvas.height=900;stadium3D=makeFootballScene();if(!stadium3D){const warning=document.createElement('div');warning.style.cssText='padding:12px;background:#793333;color:white;font-weight:700';warning.textContent='3D engine se nenačetl. Zkontroluj internet a obnov stránku. Verze 2.1';document.getElementById('gameWrap').prepend(warning)}const statusEl=document.createElement('div');statusEl.id='modelStatus';statusEl.style.cssText='padding:6px 10px;background:#152f43;color:#f6c65e;font-size:12px';statusEl.textContent=window.career3DStatus||'Načítání 3D…';document.getElementById('gameWrap').prepend(statusEl);const pos=e=>{let r=(stadium3D?stadium3D.renderer.domElement:canvas).getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*720,y:(e.clientY-r.top)/r.height*900}};let down=null;(stadium3D?stadium3D.renderer.domElement:canvas).onpointerdown=e=>{e.preventDefault();down=pos(e);e.currentTarget.setPointerCapture(e.pointerId);if(G.phase==='ready')moveKeeper(down.x)};(stadium3D?stadium3D.renderer.domElement:canvas).onpointermove=e=>{if(down&&G.phase==='ready')moveKeeper(pos(e).x)};(stadium3D?stadium3D.renderer.domElement:canvas).onpointerup=e=>{if(!down)return;let p=pos(e);if(G.phase==='flying'){diveAt(p.x,p.y)}else if(G.phase==='ready'){moveKeeper(p.x)}else if(G.phase==='result'){nextShot()}down=null};$('leftBtn').onclick=()=>diveAt(180,370);$('centerBtn').onclick=()=>diveAt(360,390);$('rightBtn').onclick=()=>diveAt(540,370);if(G.phase==='result')$('gameInfo').textContent=G.result}
